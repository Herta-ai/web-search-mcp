name: 📦 Publish package to npm

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    name: Publish with npm trusted publishing (OIDC)
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: 🟢 Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.7

      - name: 📦 Install dependencies
        run: bun install --frozen-lockfile

      - name: 🟩 Set up Node.js for npm trusted publishing
        uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - name: ⬆️ Upgrade npm for trusted publishing
        run: |
          npm install --global npm@latest
          node --version
          npm --version
          npm_version="$(npm --version)"
          npm_major="${npm_version%%.*}"
          npm_minor="${npm_version#*.}"
          npm_minor="${npm_minor%%.*}"
          if [ "$npm_major" -lt 11 ] || { [ "$npm_major" -eq 11 ] && [ "$npm_minor" -lt 5 ]; }; then
            echo "npm Trusted Publishing requires npm 11.5.1 or newer; found $npm_version" >&2
            exit 1
          fi

      - name: 🔎 Validate package
        run: bun run typecheck && bun run build && npm pack --dry-run

      - name: 🧪 Diagnose npm trusted publishing
        shell: bash
        env:
          EXPECTED_PACKAGE: "@herta-ai/web-search-mcp"
          EXPECTED_WORKFLOW: "npm-publish.yml"
        run: |
          set -euo pipefail

          package_name="$(node -p "require('./package.json').name")"
          package_version="$(node -p "require('./package.json').version")"
          package_access="$(node -p "require('./package.json').publishConfig?.access ?? '(unset)'")"
          package_provenance="$(node -p "String(require('./package.json').publishConfig?.provenance ?? false)")"

          echo "package.name=$package_name"
          echo "package.version=$package_version"
          echo "package.publishConfig.access=$package_access"
          echo "package.publishConfig.provenance=$package_provenance"
          echo "npm.registry=$(npm config get registry)"
          echo "npm.scope.registry=$(npm config get @herta-ai:registry)"
          echo "github.repository=$GITHUB_REPOSITORY"
          echo "github.ref=$GITHUB_REF"
          echo "github.ref_name=$GITHUB_REF_NAME"
          echo "github.workflow=$GITHUB_WORKFLOW"
          echo "github.workflow_ref=$GITHUB_WORKFLOW_REF"

          test "$package_name" = "$EXPECTED_PACKAGE" || {
            echo "Package name does not match the npm package configured for Trusted Publisher." >&2
            exit 1
          }

          test "$GITHUB_REPOSITORY" = "Herta-ai/web-search-mcp" || {
            echo "GitHub repository does not match the Trusted Publisher configuration." >&2
            exit 1
          }

          case "$GITHUB_WORKFLOW_REF" in
            */.github/workflows/$EXPECTED_WORKFLOW@*) ;;
            *)
              echo "Workflow filename does not match $EXPECTED_WORKFLOW." >&2
              exit 1
              ;;
          esac

          echo "Checking package metadata visible to the public npm registry..."
          if npm view "$package_name" version --registry=https://registry.npmjs.org; then
            echo "Package already exists in the public registry."
          else
            echo "Package is not currently visible in the public registry; this is expected for a first publish."
          fi

      - name: 🧾 npm publish dry run
        run: npm publish --dry-run --access public --provenance --loglevel verbose

      - name: 🔐 Inspect GitHub OIDC claims (safe fields only)
        shell: bash
        run: |
          set -euo pipefail

          curl --fail-with-body --silent --show-error \
            -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=npm:registry.npmjs.org" \
            | node -e 'let input=""; process.stdin.on("data", c => input += c).on("end", () => { const token = JSON.parse(input).value; const payload = JSON.parse(Buffer.from(token.split(".")[1], "base64url")); for (const key of ["aud", "iss", "repository", "repository_owner", "workflow_ref", "job_workflow_ref", "ref", "event_name", "environment"]) console.log(`oidc.${key}=${payload[key] ?? "(unset)"}`); })'

      - name: 🚀 Publish to npm with OIDC provenance
        run: npm publish --access public --provenance --loglevel verbose
